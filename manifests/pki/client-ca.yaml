# Client CA. Core signs user client certificates with its key from client-root-secret.
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: client-root-ca
  namespace: cert-manager
spec:
  isCA: true
  commonName: OpenDefence Client Root CA
  secretName: client-root-secret
  # A new key or an expired CA makes Traefik reject every user certificate
  duration: 87600h
  privateKey:
    algorithm: ECDSA
    size: 256
    rotationPolicy: Never
  issuerRef:
    name: selfsigned-issuer
    kind: ClusterIssuer
    group: cert-manager.io
---
# The CA certificate without its key, for Traefik to verify client certificates
apiVersion: trust.cert-manager.io/v1alpha1
kind: Bundle
metadata:
  name: client-ca
spec:
  sources:
    - secret:
        name: client-root-secret
        key: tls.crt
  target:
    secret:
      key: ca.crt
    namespaceSelector:
      matchLabels:
        kubernetes.io/metadata.name: traefik-system
