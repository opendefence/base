deployment:
  podAnnotations:
    linkerd.io/inject: enabled
    config.linkerd.io/proxy-await: enabled
    config.linkerd.io/skip-inbound-ports: "80,443"
updateStrategy:
  type: Recreate
  rollingUpdate: null
providers:
  kubernetesCRD:
    allowCrossNamespace: true
logs:
  access:
    enabled: true
    format: json
    fields:
      headers:
        names:
          X-Request-ID: keep
service:
  type: ClusterIP
ports:
  web:
    port: 80
    hostPort: 80
    expose:
      default: true
    exposedPort: 80
    redirections:
      entryPoint:
        to: websecure
        scheme: https
        permanent: true
  websecure:
    port: 443
    hostPort: 443
    expose:
      default: true
    exposedPort: 443
