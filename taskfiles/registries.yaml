version: "3"

vars:
  CLUSTER_NAME: '{{.CLUSTER_NAME | default "opendefence-dev"}}'
  KIND_NETWORK: '{{.KIND_NETWORK | default (printf "kind-%s" .CLUSTER_NAME)}}'
  REGISTRY_PORT: '{{.REGISTRY_PORT | default "5000"}}'
  LOCAL_REGISTRY_NAME: '{{.LOCAL_REGISTRY_NAME | default "local-registry"}}'
  LOCAL_REGISTRY_BIND_ADDRESS: '{{.LOCAL_REGISTRY_BIND_ADDRESS | default "127.0.0.1"}}'
  REGISTRY_IMAGE: '{{.REGISTRY_IMAGE | default "registry:3"}}'
  REGISTRY_RESTART_POLICY: '{{.REGISTRY_RESTART_POLICY | default "always"}}'
  PULL_THROUGH_CACHES:
    map:
      docker.io:
        container: proxy-dockerhub
        upstream: https://registry-1.docker.io
      ghcr.io:
        container: proxy-ghcr
        upstream: https://ghcr.io
  CONTAINER_RUNTIME:
    sh: |
      if [ -n "${CONTAINER_RUNTIME:-}" ]; then
        printf '%s' "$CONTAINER_RUNTIME"
      elif command -v docker >/dev/null 2>&1 && docker info >/dev/null 2>&1 && ! docker version 2>&1 | grep -qi podman; then
        printf '%s' docker
      elif command -v podman >/dev/null 2>&1 && podman info >/dev/null 2>&1; then
        printf '%s' podman
      fi

env:
  RUNTIME: "{{.CONTAINER_RUNTIME}}"
  CLUSTER: "{{.CLUSTER_NAME}}"
  NETWORK: "{{.KIND_NETWORK}}"

tasks:
  up:
    desc: Start the local registry and pull-through caches
    preconditions: &runtime
      - sh: "{{.CONTAINER_RUNTIME | shellQuote}} info >/dev/null 2>&1"
        msg: Start Docker or Podman, or select one with CONTAINER_RUNTIME
      - sh: command -v jq >/dev/null
        msg: jq is not on PATH
    cmds:
      - task: start-local
      - task: start-caches

  start-local:
    aliases: [local]
    desc: Start the local push/pull registry
    preconditions: *runtime
    cmds:
      - task: create-local
      - task: start-container
        vars:
          NAME: "{{.LOCAL_REGISTRY_NAME}}"

  start-caches:
    aliases: [caches]
    desc: Start pull-through cache registries
    preconditions: *runtime
    cmds:
      - for: { var: PULL_THROUGH_CACHES }
        task: start-cache
        vars:
          NAME: "{{.ITEM.container}}"
          UPSTREAM: "{{.ITEM.upstream}}"

  connect:
    desc: Attach the registries to the kind network
    preconditions: *runtime
    cmds:
      - task: connect-container
        vars:
          NAME: "{{.LOCAL_REGISTRY_NAME}}"
      - for: { var: PULL_THROUGH_CACHES }
        task: connect-container
        vars:
          NAME: "{{.ITEM.container}}"

  disconnect:
    desc: Detach the owned registries from the cluster network
    preconditions: *runtime
    cmds:
      - task: disconnect-container
        vars:
          NAME: "{{.LOCAL_REGISTRY_NAME}}"
      - for: { var: PULL_THROUGH_CACHES }
        task: disconnect-container
        vars:
          NAME: "{{.ITEM.container}}"

  down:
    desc: Remove owned registry containers and their anonymous volumes
    preconditions: *runtime
    cmds:
      - task: remove-container
        vars:
          NAME: "{{.LOCAL_REGISTRY_NAME}}"
      - for: { var: PULL_THROUGH_CACHES }
        task: remove-container
        vars:
          NAME: "{{.ITEM.container}}"

  status:
    aliases: [s]
    desc: Show registry containers without changing resources
    preconditions: *runtime
    cmds:
      - task: show-container
        vars:
          NAME: "{{.LOCAL_REGISTRY_NAME}}"
      - for: { var: PULL_THROUGH_CACHES }
        task: show-container
        vars:
          NAME: "{{.ITEM.container}}"

  create-local:
    internal: true
    vars:
      NAME: "{{.LOCAL_REGISTRY_NAME}}"
    deps: &owner-check
      - task: check-owner
        vars:
          NAME: "{{.NAME}}"
    status: &exists
      - |
        ids=$({{.CONTAINER_RUNTIME | shellQuote}} ps -aq --filter {{printf "name=^%s$" (.NAME | regexQuoteMeta) | shellQuote}}) || exit 1
        test -n "$ids"
    cmds:
      - >-
        {{.CONTAINER_RUNTIME | shellQuote}} create
        --name {{.LOCAL_REGISTRY_NAME | shellQuote}}
        --label {{printf "io.opendefence.base.owner=%s" .CLUSTER_NAME | shellQuote}}
        --label {{printf "io.opendefence.base.network=%s" .KIND_NETWORK | shellQuote}}
        --restart {{.REGISTRY_RESTART_POLICY | shellQuote}}
        -e {{printf "REGISTRY_HTTP_ADDR=:%s" .REGISTRY_PORT | shellQuote}}
        -p {{printf "%s:%s:%s" .LOCAL_REGISTRY_BIND_ADDRESS .REGISTRY_PORT .REGISTRY_PORT | shellQuote}}
        {{.REGISTRY_IMAGE | shellQuote}}

  start-cache:
    internal: true
    requires:
      vars: [NAME, UPSTREAM]
    cmds:
      - task: create-cache
        vars:
          NAME: "{{.NAME}}"
          UPSTREAM: "{{.UPSTREAM}}"
      - task: start-container
        vars:
          NAME: "{{.NAME}}"

  create-cache:
    internal: true
    requires:
      vars: [NAME, UPSTREAM]
    deps: *owner-check
    status: *exists
    cmds:
      - >-
        {{.CONTAINER_RUNTIME | shellQuote}} create
        --name {{.NAME | shellQuote}}
        --label {{printf "io.opendefence.base.owner=%s" .CLUSTER_NAME | shellQuote}}
        --label {{printf "io.opendefence.base.network=%s" .KIND_NETWORK | shellQuote}}
        --restart {{.REGISTRY_RESTART_POLICY | shellQuote}}
        -e {{printf "REGISTRY_HTTP_ADDR=:%s" .REGISTRY_PORT | shellQuote}}
        -e {{printf "REGISTRY_PROXY_REMOTEURL=%s" .UPSTREAM | shellQuote}}
        {{.REGISTRY_IMAGE | shellQuote}}

  start-container:
    internal: true
    requires:
      vars: [NAME]
    deps: *owner-check
    status:
      - |
        ids=$({{.CONTAINER_RUNTIME | shellQuote}} ps -q --filter {{printf "name=^%s$" (.NAME | regexQuoteMeta) | shellQuote}} --filter status=running) || exit 1
        test -n "$ids"
    cmds:
      - |
        set -eu
        ids=$("$RUNTIME" ps -aq --filter {{printf "name=^%s$" (.NAME | regexQuoteMeta) | shellQuote}} --filter "label=io.opendefence.base.owner=$CLUSTER" --filter "label=io.opendefence.base.network=$NETWORK")
        test -n "$ids"
        "$RUNTIME" start $ids

  connect-container:
    internal: true
    requires:
      vars: [NAME]
    deps: *owner-check
    status:
      - |
        ids=$({{.CONTAINER_RUNTIME | shellQuote}} ps -aq --filter {{printf "name=^%s$" (.NAME | regexQuoteMeta) | shellQuote}} --filter {{printf "network=%s" .KIND_NETWORK | shellQuote}}) || exit 1
        test -n "$ids"
    cmds:
      - |
        set -eu
        ids=$("$RUNTIME" ps -aq --filter {{printf "name=^%s$" (.NAME | regexQuoteMeta) | shellQuote}} --filter "label=io.opendefence.base.owner=$CLUSTER" --filter "label=io.opendefence.base.network=$NETWORK")
        test -n "$ids"
        "$RUNTIME" network connect "$NETWORK" $ids

  disconnect-container:
    internal: true
    requires:
      vars: [NAME]
    deps: *owner-check
    status:
      - |
        ids=$({{.CONTAINER_RUNTIME | shellQuote}} ps -aq --filter {{printf "name=^%s$" (.NAME | regexQuoteMeta) | shellQuote}} --filter {{printf "network=%s" .KIND_NETWORK | shellQuote}}) || exit 1
        test -z "$ids"
    cmds:
      - |
        set -eu
        ids=$("$RUNTIME" ps -aq --filter {{printf "name=^%s$" (.NAME | regexQuoteMeta) | shellQuote}} --filter "label=io.opendefence.base.owner=$CLUSTER" --filter "label=io.opendefence.base.network=$NETWORK" --filter "network=$NETWORK")
        for container_id in $ids; do "$RUNTIME" network disconnect "$NETWORK" "$container_id"; done

  remove-container:
    internal: true
    requires:
      vars: [NAME]
    deps: *owner-check
    status:
      - |
        ids=$({{.CONTAINER_RUNTIME | shellQuote}} ps -aq --filter {{printf "name=^%s$" (.NAME | regexQuoteMeta) | shellQuote}}) || exit 1
        test -z "$ids"
    cmds:
      - |
        set -eu
        ids=$("$RUNTIME" ps -aq --filter {{printf "name=^%s$" (.NAME | regexQuoteMeta) | shellQuote}} --filter "label=io.opendefence.base.owner=$CLUSTER" --filter "label=io.opendefence.base.network=$NETWORK")
        for container_id in $ids; do "$RUNTIME" rm -f -v "$container_id"; done

  show-container:
    internal: true
    requires:
      vars: [NAME]
    cmds:
      - '{{.CONTAINER_RUNTIME | shellQuote}} ps -a --filter {{printf "name=^%s$" (.NAME | regexQuoteMeta) | shellQuote}}'

  check-owner:
    internal: true
    requires:
      vars: [NAME]
    cmds:
      - |
        set -eu
        ids=$("$RUNTIME" ps -aq --filter {{printf "name=^%s$" (.NAME | regexQuoteMeta) | shellQuote}})
        if [ -z "$ids" ]; then exit 0; fi
        inspection=$("$RUNTIME" inspect $ids)
        printf '%s' "$inspection" | jq -e --arg cluster "$CLUSTER" --arg network "$NETWORK" '
          all(.[]; .Config.Labels["io.opendefence.base.owner"] == $cluster and
                   .Config.Labels["io.opendefence.base.network"] == $network)' >/dev/null || {
          echo {{printf "%s: not owned by this cluster/network; remove or rename it explicitly" .NAME | shellQuote}} >&2
          exit 1
        }
